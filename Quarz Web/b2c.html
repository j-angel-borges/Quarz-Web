<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUARZ — Producto B2C</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .stage-subpage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
        }

        /* Header con logo dorado y flecha '>' a la derecha */
        .sub-header-right {
            position: absolute;
            top: 3.5vh;
            right: 6vw;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 50;
            opacity: 1 !important;
            transform: none !important;
            pointer-events: auto !important;
        }

        .brand-logo-gold {
            height: clamp(28px, 3.5vh, 45px);
            width: auto;
            object-fit: contain;
        }

        .logo-arrow {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 2vw, 2.2rem);
            font-weight: 700;
            color: var(--gold-circuit);
            line-height: 1;
        }

        /* Título en la esquina inferior izquierda */
        .subpage-title-ll {
            position: absolute;
            bottom: 6vh;
            left: 6vw;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: clamp(0.75rem, 1.1vw, 1.05rem);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--text-black);
            text-decoration: none;
            z-index: 30;
        }

        /* Diana concéntrica con botón central "CLIC" */
        .b2c-target-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(216, 210, 194, 0.4);
            box-sizing: border-box;
        }

        .ring-1 { width: clamp(340px, 38vw, 560px); height: clamp(340px, 38vw, 560px); border-color: rgba(229, 224, 212, 0.5); }
        .ring-2 { width: clamp(270px, 30vw, 440px); height: clamp(270px, 30vw, 440px); border-color: rgba(216, 206, 185, 0.6); }
        .ring-3 { width: clamp(200px, 22vw, 320px); height: clamp(200px, 22vw, 320px); border-color: rgba(200, 188, 162, 0.8); border-width: 1.5px; }

        .clic-circle {
            position: relative;
            width: clamp(100px, 11vw, 160px);
            height: clamp(100px, 11vw, 160px);
            border-radius: 50%;
            background-color: #e7e2d4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: clamp(0.75rem, 0.95vw, 0.95rem);
            letter-spacing: 2px;
            color: #2b2b2b;
            z-index: 15;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        .clic-circle:hover {
            transform: scale(1.05);
            background-color: #dfd8c6;
        }

        /* SVG Circuit Overlay */
        #circuit-svg-sub {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 20;
        }

        /* Top Blur Overlay */
        .top-blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 8vh;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.8);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            z-index: 15;
            pointer-events: none;
            transition: background-color 1s ease;
        }

        /* Canvas de Estrellas */
        #space-canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        /* Transiciones y Modo Oscuro */
        body {
            transition: background-color 1s ease;
        }
        body.dark-mode {
            background-color: #0a0a0a;
        }
        .stage-subpage {
            transition: background-color 1s ease;
        }
        body.dark-mode .stage-subpage {
            background-color: transparent;
        }
        body.dark-mode .top-blur-overlay {
            background-color: rgba(10, 10, 10, 0.8);
        }
        .subpage-title-ll, .logo-arrow, .circuit-path, .circuit-node {
            transition: color 1s ease, stroke 1s ease, fill 1s ease !important;
        }
        body.dark-mode .subpage-title-ll, 
        body.dark-mode .logo-arrow {
            color: #ffffff;
        }
        body.dark-mode .circuit-path {
            stroke: #ffffff !important;
        }
        body.dark-mode .circuit-node {
            fill: #ffffff !important;
        }
        .ring {
            transition: transform 1.5s ease-in-out, opacity 1.5s ease-in-out, border-color 1s ease;
            transform-origin: center;
        }
        body.dark-mode .ring {
            opacity: 0;
        }
        body.dark-mode .ring-1 {
            transform: scale(2);
            border-color: rgba(255, 255, 255, 0.2);
        }
        body.dark-mode .ring-2 {
            transform: scale(2.5);
            border-color: rgba(255, 255, 255, 0.4);
        }
        body.dark-mode .ring-3 {
            transform: scale(3);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .clic-circle {
            transition: opacity 0.5s ease, transform 0.5s ease, background-color 0.25s ease;
        }
        body.dark-mode .clic-circle {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }
        .brand-logo-gold {
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>

    <div class="stage-subpage">

        <!-- Canvas de Estrellas -->
        <canvas id="space-canvas"></canvas>

        <!-- Overlay de Difuminado Superior -->
        <div class="top-blur-overlay"></div>

        <!-- Header Logo Dorado con Flecha a la Derecha (QUARZ >) -->
        <header class="sub-header-right">
            <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
                <img src="media/logos/QUARZ_Logo_Dorado_Claro.png" alt="QUARZ" class="brand-logo-gold">
                <span class="logo-arrow">&gt;</span>
            </a>
        </header>

        <!-- Elemento Central: Anillos Concéntricos + Botón CLIC -->
        <div class="b2c-target-container">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="clic-circle">CLIC</div>
        </div>

        <!-- Título Superior Izquierda Abajo -->
        <a href="index.html" class="subpage-title-ll" id="sub-title">PRODUCTO B2C</a>

        <!-- Línea de Circuito SVG Conectando Abajo-Izquierda con la Cabecera -->
        <svg id="circuit-svg-sub" viewBox="0 0 1920 1080" preserveAspectRatio="none">
            <path id="sub-line" class="circuit-path" d="" />
            <circle id="sub-node-start" class="circuit-node" r="3.5" style="opacity:1;" />
            <circle id="sub-node-end" class="circuit-node" r="3.5" style="opacity:1;" />
        </svg>

    </div>

    <script>
        function drawSubpageCircuit() {
            const W = window.innerWidth;
            const H = window.innerHeight;
            const svg = document.getElementById("circuit-svg-sub");
            svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

            const title = document.getElementById("sub-title");
            const line = document.getElementById("sub-line");
            const nStart = document.getElementById("sub-node-start");
            const nEnd = document.getElementById("sub-node-end");

            const rTitle = title.getBoundingClientRect();

            const startX = rTitle.left + 15;
            const startY = rTitle.top - 12;

            const yChannel = H * 0.08;
            const endX = W * 0.66;

            const pts = [
                [startX, startY],
                [startX, yChannel],
                [endX, yChannel]
            ];

            line.setAttribute("d", "M " + pts.map(p => p[0] + " " + p[1]).join(" L "));
            line.style.strokeDasharray = "none";
            line.style.strokeDashoffset = "0";

            nStart.setAttribute("cx", startX);
            nStart.setAttribute("cy", startY);

            nEnd.setAttribute("cx", endX);
            nEnd.setAttribute("cy", yChannel);
        }

        window.addEventListener("load", drawSubpageCircuit);
        window.addEventListener("resize", drawSubpageCircuit);

        function initStars() {
            const canvas = document.getElementById('space-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            let stars = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Crear estrellas
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.2 + 0.3, // Radio sutil
                    vx: (Math.random() - 0.5) * 0.08, // Movimiento muy lento
                    vy: (Math.random() - 0.5) * 0.08,
                    alpha: 0, // Inician invisibles
                    maxAlpha: Math.random() * 0.8 + 0.2, // Su brillo máximo
                    alphaDir: 1, // Siempre empiezan subiendo su brillo
                    alphaSpeed: Math.random() * 0.005 + 0.002, // Parpadeo sutil
                    active: false,
                    activationDelay: Math.random() * 6000 // un delay aleatorio de 0 a 6 segundos para ir apareciendo
                });
            }

            let spawnStartTime = 0;

            function animate(timestamp) {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'white';
                
                // Márgenes para evitar que toquen los bordes exactos
                const marginX = w * 0.06;
                const marginY = h * 0.08;

                const isSpawning = document.body.classList.contains('show-stars');
                if (isSpawning && !spawnStartTime) {
                    spawnStartTime = timestamp;
                }

                if (isSpawning) {
                    const elapsed = timestamp - spawnStartTime;

                    for(let s of stars) {
                        // Activar la estrella si ya pasó su delay
                        if (!s.active && elapsed > s.activationDelay) {
                            s.active = true;
                        }

                        if (s.active) {
                            s.x += s.vx;
                            s.y += s.vy;
                            s.alpha += s.alphaDir * s.alphaSpeed;

                            if(s.alpha >= s.maxAlpha) { s.alpha = s.maxAlpha; s.alphaDir = -1; }
                            if(s.alpha <= 0.1) { s.alpha = 0.1; s.alphaDir = 1; }

                            if(s.x < 0) s.x = w;
                            if(s.x > w) s.x = 0;
                            if(s.y < 0) s.y = h;
                            if(s.y > h) s.y = 0;

                            // Dibujar sólo si está dentro de los márgenes
                            if (s.x > marginX && s.x < w - marginX && s.y > marginY && s.y < h - marginY) {
                                ctx.globalAlpha = s.alpha;
                                ctx.beginPath();
                                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }
        window.addEventListener("load", initStars);

        document.addEventListener("DOMContentLoaded", function() {
            const btnClic = document.querySelector('.clic-circle');
            if (btnClic) {
                btnClic.addEventListener('click', function() {
                    document.body.classList.add('dark-mode');
                    const logo = document.querySelector('.brand-logo-gold');
                    logo.style.opacity = 0;
                    setTimeout(() => {
                        logo.src = 'media/logos/QUARZ_Logo_Invertido.jpg';
                        logo.style.opacity = 1;
                    }, 500);

                    // Aparecen las estrellas después de que la onda expansiva termine (1.5s)
                    setTimeout(() => {
                        document.body.classList.add('show-stars');
                    }, 1500);
                });
            }
        });
    </script>

</body>

</html>
